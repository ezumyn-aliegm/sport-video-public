services:
  sport-video:
    build: .
    container_name: sport-video
    ports:
      - "3015:3000"
    # Keep the generated FAMILY_PIN_HASH assignment in .env; hash-pin.js escapes Compose interpolation.
    env_file: .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
