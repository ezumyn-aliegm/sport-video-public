<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="diamond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#3F6212"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#diamond)"/>
  
  <!-- Infield dirt -->
  <polygon points="160,180 100,120 160,60 220,120" fill="#D4A373" opacity="0.6"/>
  
  <!-- Bases -->
  <rect x="95" y="115" width="10" height="10" fill="white" transform="rotate(45 100 120)"/>
  <rect x="215" y="115" width="10" height="10" fill="white" transform="rotate(45 220 120)"/>
  <rect x="155" y="55" width="10" height="10" fill="white" transform="rotate(45 160 60)"/>
  
  <!-- Pitcher -->
  <ellipse cx="160" cy="110" rx="20" ry="10" fill="#1A1A1A" opacity="0.3"/>
  <path d="M 153 110 L 153 85 L 158 75 L 168 75 L 172 85 L 172 110 Z" fill="#1A1A1A" opacity="0.4"/>
  <circle cx="162" cy="70" r="8" fill="#1A1A1A" opacity="0.4"/>
  
  <!-- Ball in air -->
  <circle cx="140" cy="90" r="6" fill="white"/>
  
  <!-- Play button -->
  <circle cx="160" cy="90" r="28" fill="rgba(0,0,0,0.5)"/>
  <polygon points="150,75 150,105 175,90" fill="white"/>
  
  <!-- Duration badge -->
  <rect x="270" y="150" width="40" height="20" rx="4" fill="rgba(0,0,0,0.75)"/>
  <text x="290" y="164" text-anchor="middle" font-family="system-ui" font-size="12" fill="white">0:58</text>
  
  <!-- Score bug -->
  <rect x="10" y="10" width="100" height="30" rx="6" fill="rgba(0,0,0,0.6)"/>
  <text x="60" y="30" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="white">5 - 3</text>
</svg>
